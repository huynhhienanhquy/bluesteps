services:
  db:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: bluesteps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BLUESTEPS_LOCAL_DB_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - bluesteps_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bluesteps"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bluesteps_pg:
